name: Bug Report
description: Report a bug or unexpected behavior
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill in the details below.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
      placeholder: What happened?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reproduce the behavior.
      placeholder: |
        1. Run `fackel example.com --no-active-scan`
        2. Observe error in output
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / output
      description: Paste any relevant terminal output (use `-v` for verbose).
      render: shell

  - type: dropdown
    id: scan-type
    attributes:
      label: Scan type
      options:
        - Passive only (--no-active-scan)
        - Full scan (active)
        - Both
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: "3.12.x"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Ubuntu 24.04 / macOS 15 / ..."
    validations:
      required: true

  - type: textarea
    id: env
    attributes:
      label: Environment details
      description: Relevant binary versions (nmap, nuclei, etc.) or provider keys configured.
      placeholder: |
        nmap 7.95
        nuclei v3.3.x
        SHODAN_API_KEY=set
