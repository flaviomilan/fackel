version: 2

updates:
  # Python dependencies (pip ecosystem)
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    reviewers:
      - flaviomilan
    labels:
      - dependencies
      - automated
    commit-message:
      prefix: "deps"
    # Collapse every pip update into a single PR. Omitting `update-types`
    # groups all semver levels; restricting it lets updates escape the group
    # and open one PR each (what previously happened).
    groups:
      python-dependencies:
        patterns:
          - "*"

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    reviewers:
      - flaviomilan
    labels:
      - ci
      - automated
    commit-message:
      prefix: "ci"
    # Same policy for Actions: one grouped PR covering all update types.
    groups:
      github-actions:
        patterns:
          - "*"
