version: 2

updates:
  # Python dependencies. This project is uv-managed (pyproject.toml + uv.lock),
  # so use the `uv` ecosystem: it is what Dependabot already picks for this
  # repo's security alerts, and keeping version and security updates under one
  # ecosystem lets both be grouped.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    reviewers:
      - flaviomilan
    labels:
      - dependencies
      - automated
    commit-message:
      prefix: "deps"
    # One PR for all version updates, one PR for all security updates.
    # A group matches version updates unless `applies-to: security-updates`
    # is set, and omitting `update-types` keeps every semver level in the
    # group (restricting it was why updates used to escape into one PR each).
    groups:
      python-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
      python-security:
        applies-to: security-updates
        patterns:
          - "*"

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    reviewers:
      - flaviomilan
    labels:
      - ci
      - automated
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"
