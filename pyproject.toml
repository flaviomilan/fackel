[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fackel"
version = "1.7.0"
description = "Autonomous OSINT and security intelligence agent"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Fackel Team" }]
dependencies = [
  "python-whois>=0.9.6",
  "shodan>=1.31",
  "ddgs>=1.1.1",
  "censys>=2.2.19",
  "langchain>=1.3.14",
  "langchain-openai>=1.3.5",
  "langchain-ollama>=1.1.0",
  "langgraph>=1.0.10",
  "langgraph-checkpoint-sqlite>=3.1.0",
  "beautifulsoup4>=4.12",
  "requests>=2.31",
  "python-dotenv>=1.2.2",
  "python-nmap>=0.7",
  "pydantic>=2.6",
  "typer>=0.12",
  "rich>=13.0",
  "prompt-toolkit>=3.0",
]

[project.scripts]
fackel = "cli.main:app"

[project.optional-dependencies]
dev = [
  "ruff>=0.4",
  "mypy>=2.3.0",
  "pytest>=9.0.3",
  "pytest-asyncio>=0.24",
  "coverage>=7.5",
  "pip-audit>=2.10.0",
  "python-semantic-release>=10.6.1",
  "commitizen>=4.16.5",
  "pre-commit>=4.0",
  "types-requests>=2.33.0.20260712",
  "types-python-nmap>=0.7",
  "types-beautifulsoup4>=4.12",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]

[tool.setuptools.package-data]
"fackel.tools.scanning" = ["wordlists/*.txt"]

[tool.uv]
package = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "C4", "SIM", "RUF", "C901"]
ignore = ["E501"]

# Complexity ratchet: blocks NEW functions above this ceiling. A handful of
# pre-existing tool-output parsers / report builders exceed it and carry an
# explicit ``# noqa: C901``; tighten this number over time as they are split.
[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*.py" = ["S101"]
"src/cli/**/*.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_any_unimported = true
mypy_path = ["src"]
namespace_packages = true
explicit_package_bases = true
plugins = ["pydantic.mypy"]
exclude = ["tests/fixtures"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "integration: marks tests that hit external services",
  "eval: offline scan-quality regression against golden fixtures (no LLM/network)",
]

[tool.coverage.run]
source = ["src"]
branch = true

# ── Semantic Release ───────────────────────────────────────────────────────
[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
branch = "main"
commit_message = "chore(release): {version} [skip ci]"
build_command = "uv build"
tag_format = "v{version}"

[tool.semantic_release.changelog]
default_templates.changelog_file = "CHANGELOG.md"

[tool.semantic_release.commit_parser_options]
allowed_tags = [
  "feat", "fix", "perf", "refactor", "revert",
  "docs", "style", "test", "chore", "ci", "build",
]
minor_tags = ["feat"]
patch_tags = ["fix", "perf", "refactor", "revert"]

[tool.semantic_release.remote]
type = "github"

[tool.semantic_release.publish]
upload_to_vcs_release = true

# ── Commitizen (commit message validation) ─────────────────────────────────
[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
allowed_prefixes = ["Merge", "Revert", "chore(release)"]
update_changelog_on_bump = false
