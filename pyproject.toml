[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fackel"
version = "0.1.0"
description = "Autonomous OSINT and security intelligence agent"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Fackel Team" }]
dependencies = [
  "python-whois>=0.9",
  "shodan>=1.31",
  "ddgs>=1.1.1",
  "censys>=2.2",
  "langchain>=1.0",
  "langchain-openai>=1.0",
  "langchain-community>=0.4",
  "langgraph>=1.0",
  "beautifulsoup4>=4.12",
  "requests>=2.31",
  "python-dotenv>=1.0",
  "google-search-results>=2.4.2",
  "python-nmap>=0.7",
  "pyyaml>=6.0",
  "langfuse>=3.0",
  "pydantic>=2.6",
  "typer>=0.12",
]

[project.scripts]
fackel = "cli.main:app"

[project.optional-dependencies]
dev = [
  "ruff>=0.4",
  "mypy>=1.9",
  "pytest>=8.2",
  "coverage>=7.5",
]
api = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.23",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]

[tool.uv]
package = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*.py" = ["S101"]
"src/cli/**/*.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_any_unimported = true
mypy_path = ["src"]
plugins = ["pydantic.mypy"]
exclude = ["tests/fixtures"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "integration: marks tests that hit external services",
]

[tool.coverage.run]
source = ["src"]
branch = true
