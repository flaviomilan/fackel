<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fackel - Scan & Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            margin-bottom: 10px;
            font-size: 2em;
        }

        .header p {
            opacity: 0.9;
        }

        .content {
            padding: 30px;
        }

        /* Formulário de Scan */
        .scan-form {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .form-group input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e1e4e8;
            border-radius: 6px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .form-group input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .checkbox-group input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        /* Progresso do Scan */
        .scan-progress {
            margin-bottom: 20px;
        }

        .scan-info {
            background: #e8f4f8;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .scan-info strong {
            color: #0066cc;
        }

        .progress-bar-container {
            background: #e1e4e8;
            height: 24px;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 15px;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 12px;
        }

        .events-log {
            background: #f8f9fa;
            border-radius: 6px;
            padding: 15px;
            max-height: 300px;
            overflow-y: auto;
        }

        .event {
            padding: 10px;
            margin-bottom: 8px;
            border-left: 3px solid #667eea;
            background: white;
            border-radius: 4px;
            font-size: 14px;
            line-height: 1.5;
        }
        
        .event.partial-report {
            border-left-color: #28a745;
            background: #f0fff4;
        }
        
        .event.policy-decision {
            border-left-color: #ffc107;
            background: #fffbf0;
        }
        
        .event.final-report {
            border-left-color: #17a2b8;
            background: #e7f7ff;
        }

        .event-type {
            font-weight: 600;
            color: #667eea;
            margin-right: 8px;
        }

        .event-time {
            color: #6c757d;
            font-size: 12px;
        }

        /* Chat */
        .chat-container {
            display: flex;
            flex-direction: column;
            height: 600px;
        }

        .scan-summary {
            background: #d4edda;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .scan-summary-info {
            flex: 1;
        }

        .scan-summary button {
            padding: 8px 16px;
            background: white;
            border: 2px solid #28a745;
            color: #28a745;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 6px;
            margin-bottom: 15px;
        }

        .message {
            margin-bottom: 15px;
            padding: 12px 16px;
            border-radius: 8px;
            max-width: 80%;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-user {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            margin-left: auto;
        }

        .message-assistant {
            background: white;
            color: #333;
            border: 1px solid #e1e4e8;
        }

        .message-sources {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(0,0,0,0.1);
            font-size: 13px;
        }

        .source {
            padding: 5px 0;
            color: #6c757d;
        }

        .chat-input-container {
            display: flex;
            gap: 10px;
        }

        .chat-input-container input {
            flex: 1;
            padding: 12px;
            border: 2px solid #e1e4e8;
            border-radius: 6px;
            font-size: 16px;
        }

        .chat-input-container input:focus {
            outline: none;
            border-color: #667eea;
        }

        .chat-input-container button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .chat-input-container button:hover:not(:disabled) {
            transform: scale(1.05);
        }

        .chat-input-container button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .loading {
            text-align: center;
            color: #6c757d;
            font-style: italic;
            padding: 10px;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔥 Fackel Security Scanner</h1>
            <p>Scan de segurança com análise inteligente por IA</p>
        </div>

        <div class="content">
            <!-- FASE 1: Formulário -->
            <div id="scanForm" class="scan-form">
                <h2 style="margin-bottom: 20px;">Iniciar Novo Scan</h2>
                <div class="form-group">
                    <label for="domainInput">Domínio-alvo:</label>
                    <input type="text" id="domainInput" placeholder="exemplo: example.com" />
                </div>
                <div class="form-group checkbox-group">
                    <input type="checkbox" id="activeScanCheck" />
                    <label for="activeScanCheck" style="margin: 0;">
                        Scan Ativo (Nmap, Nuclei - pode ser detectado)
                    </label>
                </div>
                <button class="btn" onclick="startScan()">🚀 Iniciar Scan</button>
            </div>

            <!-- FASE 2: Progresso -->
            <div id="scanProgress" class="scan-progress hidden">
                <div class="scan-info">
                    <div>
                        <strong>Scanning:</strong> <span id="scanDomain"></span>
                    </div>
                    <div>
                        <strong>Tipo:</strong> <span id="scanType"></span>
                    </div>
                </div>
                <div class="progress-bar-container">
                    <div id="progressBar" class="progress-bar" style="width: 0%;">0%</div>
                </div>
                <div class="events-log" id="eventsLog"></div>
            </div>

            <!-- FASE 3: Chat -->
            <div id="chatContainer" class="hidden">
                <div class="scan-summary">
                    <div class="scan-summary-info">
                        <div><strong>✅ Scan Concluído!</strong></div>
                        <div style="font-size: 14px; margin-top: 5px;">
                            <span id="scanIdDisplay"></span> | <span id="domainDisplay"></span>
                        </div>
                    </div>
                    <button onclick="resetScan()">🔄 Novo Scan</button>
                </div>

                <div class="chat-container">
                    <div class="messages" id="messages"></div>
                    <div class="chat-input-container">
                        <input 
                            type="text" 
                            id="questionInput" 
                            placeholder="Faça uma pergunta sobre o scan..."
                            onkeypress="if(event.key==='Enter') askQuestion()"
                        />
                        <button onclick="askQuestion()" id="askBtn">📤 Enviar</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000';
        
        let currentState = {
            status: 'idle', // idle | scanning | completed
            domain: null,
            scanId: null,
            events: [],
            progress: 0,
            totalTools: 0  // Track total tools in plan for accurate progress
        };

        // ============================================================
        // MAPEAMENTO DE FERRAMENTAS PARA DESCRIÇÕES AMIGÁVEIS
        // ============================================================
        function getToolDescription(toolName) {
            const toolDescriptions = {
                'nmap_scanner': 'Port & Service Discovery',
                'nuclei_tool': 'Vulnerability Detection',
                'httpx_tool': 'HTTP Analysis',
                'katana_tool': 'Web Crawling',
                'feroxbuster_tool': 'Directory Enumeration',
                'naabu_tool': 'Fast Port Scanning',
                'dnsdumpster_tool': 'DNS Intelligence',
                'whois': 'Domain Registration Info',
                'shodan_tool': 'Internet-wide Port Analysis',
                'censys_tool': 'Certificate & Service Analysis',
                'censys_web_tool': 'Web Service Analysis',
                'virustotal_tool': 'Threat Intelligence',
                'wafw00f_tool': 'Firewall Detection',
                'host_prober': 'Host Discovery',
                'email_analyzer': 'Email Intelligence',
                'webpage_extractor': 'Content Extraction',
                'profile_analyzer': 'Profile Analysis',
                'linkedin_employee_search': 'Employee Discovery',
                'job_search': 'Job Listings Analysis',
                'serpapi_tool': 'Search Engine Analysis',
                'duckduckgo_tool': 'Web Search'
            };
            
            return toolDescriptions[toolName] || toolName;
        }

        // ============================================================
        // INICIAR SCAN
        // ============================================================
        function startScan() {
            const domain = document.getElementById('domainInput').value.trim();
            const activeScan = document.getElementById('activeScanCheck').checked;

            if (!domain) {
                alert('Por favor, digite um domínio');
                return;
            }

            // Atualiza UI
            document.getElementById('scanForm').classList.add('hidden');
            document.getElementById('scanProgress').classList.remove('hidden');
            document.getElementById('scanDomain').textContent = domain;
            document.getElementById('scanType').textContent = activeScan ? 'Ativo' : 'Passivo';

            currentState = {
                status: 'scanning',
                domain: domain,
                scanId: null,
                events: [],
                progress: 0,
                totalTools: 0
            };

            // Connect SSE
            const eventSource = new EventSource(
                `${API_BASE}/scan/stream?domain=${encodeURIComponent(domain)}&active=${activeScan}`
            );

            eventSource.onmessage = (event) => {
                const data = JSON.parse(event.data);
                handleScanEvent(data);

                // ✨ Finalização com scan_id
                if (data.type === 'final_report' && data.scan_id) {
                    currentState.status = 'completed';
                    currentState.scanId = data.scan_id;
                    eventSource.close();
                    showChat();
                }
            };

            eventSource.addEventListener('close', () => {
                eventSource.close();
            });

            eventSource.onerror = (error) => {
                console.error('SSE Error:', error);
                eventSource.close();
                alert('Erro no scan. Verifique se o servidor está rodando.');
                resetScan();
            };
        }

        // ============================================================
        // PROCESSAR EVENTOS DO SCAN
        // ============================================================
        function handleScanEvent(data) {
            currentState.events.push(data);

            // Calcular progresso baseado em remaining + completed
            let progress = currentState.progress;
            
            if (data.type === 'final_report') {
                progress = 100;
            } else if (data.step === 'report') {
                progress = 95;
            } else if (data.step === 'plan' && data.details?.remaining !== undefined) {
                // Plan representa 5% inicial
                progress = 5;
                // Armazena total de tools para cálculo posterior
                currentState.totalTools = data.details.remaining;
            } else if (data.step === 'run' && data.details?.completed_count !== undefined) {
                // Run vai de 5% a 95%
                const completed = data.details.completed_count;
                const total = currentState.totalTools || 10; // fallback
                progress = 5 + (completed / total) * 90;
            }

            currentState.progress = Math.max(currentState.progress, Math.min(progress, 100));

            // Atualizar barra de progresso
            const progressBar = document.getElementById('progressBar');
            progressBar.style.width = `${Math.round(currentState.progress)}%`;
            progressBar.textContent = `${Math.round(currentState.progress)}%`;

            // Adicionar evento ao log
            const eventsLog = document.getElementById('eventsLog');
            const eventEl = document.createElement('div');
            eventEl.className = 'event';
            
            let details = '';
            let showInLog = false;
            
            if (data.type === 'step_update') {
                showInLog = true;
                if (data.details?.last_tool) {
                    const toolDesc = getToolDescription(data.details.last_tool);
                    details = `<strong>Scan Type:</strong> ${toolDesc}`;
                } else if (data.details?.remaining !== undefined) {
                    details = `<strong>Plan:</strong> ${data.details.remaining} scans to execute`;
                } else if (data.details?.completed_count !== undefined) {
                    const total = currentState.totalTools || '?';
                    details = `<strong>Progress:</strong> ${data.details.completed_count}/${total} scans completed`;
                }
            } else if (data.type === 'partial_report') {
                showInLog = true;
                const toolName = data.details?.tool || 'Unknown';
                const toolDesc = getToolDescription(toolName);
                const analysis = data.details?.analysis || '';
                details = `
                    <div style="margin-top: 5px;">
                        <strong>📋 ${toolDesc}</strong>
                        <div style="margin-top: 5px; padding: 8px; background: #fff; border-radius: 4px; font-size: 13px; white-space: pre-wrap;">
                            ${analysis.substring(0, 200)}${analysis.length > 200 ? '...' : ''}
                        </div>
                    </div>
                `;
            } else if (data.type === 'policy_decision') {
                showInLog = true;
                const toolsAdded = data.details?.tools_added || [];
                const toolDescriptions = toolsAdded.map(t => getToolDescription(t));
                details = `<strong>🎯 Policy:</strong> Added scans: ${toolDescriptions.join(', ')}`;
            } else if (data.type === 'final_report') {
                showInLog = true;
                details = '<strong>✅ Scan completed!</strong>';
            }

            // Add CSS class based on event type
            let eventClass = 'event';
            if (data.type === 'partial_report') eventClass += ' partial-report';
            else if (data.type === 'policy_decision') eventClass += ' policy-decision';
            else if (data.type === 'final_report') eventClass += ' final-report';
            
            eventEl.className = eventClass;

            if (showInLog) {
                eventEl.innerHTML = `
                    <span class="event-type">${data.type}</span>
                    ${details ? `<div style="margin-top: 5px;">${details}</div>` : ''}
                    <div class="event-time">${new Date(data.timestamp).toLocaleTimeString()}</div>
                `;
                
                eventsLog.appendChild(eventEl);
                eventsLog.scrollTop = eventsLog.scrollHeight;
            }
        }

        // ============================================================
        // MOSTRAR CHAT APÓS SCAN
        // ============================================================
        function showChat() {
            document.getElementById('scanProgress').classList.add('hidden');
            document.getElementById('chatContainer').classList.remove('hidden');
            
            document.getElementById('scanIdDisplay').textContent = `Scan ID: ${currentState.scanId}`;
            document.getElementById('domainDisplay').textContent = `Domain: ${currentState.domain}`;

            // Mensagem inicial
            addMessage('assistant', `✅ Scan de ${currentState.domain} concluído! Você pode fazer perguntas sobre os resultados.`);
        }

        // ============================================================
        // FAZER PERGUNTA (CHAT)
        // ============================================================
        async function askQuestion() {
            const questionInput = document.getElementById('questionInput');
            const question = questionInput.value.trim();
            
            if (!question) return;

            // Desabilita input
            questionInput.value = '';
            questionInput.disabled = true;
            document.getElementById('askBtn').disabled = true;

            // Adiciona pergunta
            addMessage('user', question);
            addMessage('assistant', '⏳ Processando...', true);

            try {
                const response = await fetch(`${API_BASE}/query`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        question: question,
                        domain: currentState.domain,
                        max_scans: 3
                    })
                });

                if (!response.ok) throw new Error('Query failed');

                const data = await response.json();
                
                // Remove loading
                const messages = document.getElementById('messages');
                messages.removeChild(messages.lastChild);

                // Adiciona resposta
                addMessage('assistant', data.answer, false, data.sources);

            } catch (error) {
                console.error('Query error:', error);
                const messages = document.getElementById('messages');
                messages.removeChild(messages.lastChild);
                addMessage('assistant', '❌ Erro ao processar pergunta. Tente novamente.');
            } finally {
                questionInput.disabled = false;
                document.getElementById('askBtn').disabled = false;
                questionInput.focus();
            }
        }

        // ============================================================
        // ADICIONAR MENSAGEM AO CHAT
        // ============================================================
        function addMessage(role, content, isLoading = false, sources = null) {
            const messagesDiv = document.getElementById('messages');
            const messageEl = document.createElement('div');
            messageEl.className = `message message-${role}`;
            
            let html = `<div>${content}</div>`;
            
            if (sources && sources.length > 0) {
                html += '<div class="message-sources">';
                html += '<strong>📚 Fontes:</strong>';
                sources.forEach(src => {
                    html += `<div class="source">📄 ${src.domain} - ${new Date(src.timestamp).toLocaleDateString()} (conf: ${(src.similarity * 100).toFixed(1)}%)</div>`;
                });
                html += '</div>';
            }
            
            messageEl.innerHTML = html;
            messagesDiv.appendChild(messageEl);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        // ============================================================
        // RESETAR PARA NOVO SCAN
        // ============================================================
        function resetScan() {
            currentState = { status: 'idle', domain: null, scanId: null, events: [], progress: 0, totalTools: 0 };
            
            document.getElementById('chatContainer').classList.add('hidden');
            document.getElementById('scanProgress').classList.add('hidden');
            document.getElementById('scanForm').classList.remove('hidden');
            
            document.getElementById('domainInput').value = '';
            document.getElementById('activeScanCheck').checked = false;
            document.getElementById('eventsLog').innerHTML = '';
            document.getElementById('messages').innerHTML = '';
        }
    </script>
</body>
</html>
